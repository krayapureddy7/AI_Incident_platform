name: CI - Tests, Tool Contracts & Eval Gate

on:
  push:
    branches: [main, master, dev, "feature/**"]
  pull_request:
    branches: [main, master, dev]

env:
  PYTHONPATH: .
  # Force UTF-8 so the eval report renders identically across runners.
  PYTHONIOENCODING: utf-8
  # Reason offline. The provider SDKs are an optional extra and are not
  # installed here, so this is belt and braces -- but it makes the guarantee
  # explicit rather than incidental: no CI job may reach a model API.
  LLM_PROVIDER: mock

jobs:
  test:
    name: Unit, contract, and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  eval-gate:
    name: Evaluation gate (trajectory + invariants)
    runs-on: ubuntu-latest
    # A release must not proceed on a safety-invariant regression, so this gate
    # depends on the unit tests and is itself required by the artifact job.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation gate
        # Exits non-zero on any failed trajectory or invariant.
        run: python -m mini_platform.evals.eval_runner

      - name: End-to-end demo sanity check
        run: python -m mini_platform.demo > demo-output.txt

      - name: Upload demo transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-transcript
          path: demo-output.txt

  versioning:
    name: Artifact version manifest check
    runs-on: ubuntu-latest
    needs: [test, eval-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify VERSION.json matches the running code
        # Agents, prompts, and tools are versioned artifacts. This step fails
        # the build if a component version drifts from the manifest, so a
        # behaviour change cannot ship without a version bump and a rollback
        # target.
        run: python -m tools.check_versions

  promote-to-dev:
    name: Auto-promote feature branch to dev
    runs-on: ubuntu-latest
    # Only a push (not a PR) to a feature/** branch promotes -- and only once
    # every gate above (tests, eval, version manifest) has passed on that
    # exact commit. A feature branch merged straight to main via PR bypasses
    # this job entirely; dev is purely a green-build integration branch fed by
    # feature branches, never the other way around.
    needs: [test, eval-gate, versioning]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge into dev and push
        # Merges the exact commit that just passed CI (not a re-fetched branch
        # tip, which could have moved) into dev, fast-forwarding dev's history
        # rather than rewriting it. `[skip ci]` avoids a redundant second CI
        # run on dev for a merge commit that already passed as this commit.
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          git merge --no-ff "${GITHUB_SHA}" -m "Auto-promote ${GITHUB_SHA::7} from ${GITHUB_REF_NAME} to dev [skip ci]"
          git push origin dev
